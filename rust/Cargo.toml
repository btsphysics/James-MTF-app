[package]
name = "xray_app"
version = "1.0.0"
edition = "2021"
description = "X-ray spectrum, Monte Carlo transmission and MTF/NNPS/DQE - Rust port of app.py"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xray_cli"
path = "src/bin/xray_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
rustfft = "6"
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
